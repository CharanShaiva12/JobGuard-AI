name: JobGuard AI Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend TypeScript Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  python-ml-and-security:
    name: Python ML Artifacts, AST & Security Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python testing/run_tests.py
      - run: python testing/negative/test_security_negative.py
      - name: Verify trained ML inference artifacts load
        run: |
          python -c "
          import joblib, json
          joblib.load('ml/artifacts/vectorizer.joblib')
          joblib.load('ml/artifacts/text_model.joblib')
          joblib.load('ml/artifacts/url_model.joblib')
          joblib.load('ml/artifacts/url_logreg_model.joblib')
          json.load(open('ml/artifacts/text_metrics.json'))
          json.load(open('ml/artifacts/url_metrics.json'))
          print('All ML artifacts verified successfully!')
          "
