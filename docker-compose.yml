# ==============================================================================
# JobGuard AI - Full-Stack Cross-Platform Docker Compose Orchestration
# Usage: docker compose up --build
# Note: Completely isolated from your local Windows MySQL84 service.
# ==============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: jobguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-jobguard_docker_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-jobguard_db}
    ports:
      - "3307:3306"
    volumes:
      - jobguard_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./database/migrations.sql:/docker-entrypoint-initdb.d/03-migrations.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-jobguard_docker_root_pw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml:
    build:
      context: ./ml
    container_name: jobguard-ml
    restart: unless-stopped
    environment:
      ML_CORS_ORIGINS: http://backend:5000,http://localhost:5000,http://localhost:5173,http://localhost:8080
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: jobguard-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-jobguard_docker_root_pw}
      DB_NAME: ${DB_NAME:-jobguard_db}
      ML_SERVICE_URL: http://ml:8000
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-jobguard_docker_jwt_secret_key_please_override_in_prod}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-jobguard_docker_captcha_secret_token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      JOBGUARD_MODE: ${JOBGUARD_MODE:-auto}
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend
    container_name: jobguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  jobguard_mysql_data:
