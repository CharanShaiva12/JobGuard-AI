# ==============================================================================
# JobGuard AI - Apache 2.4 Virtual Host & Reverse Proxy Configuration
# ==============================================================================
# This configuration file configures Apache HTTP Server 2.4 as the primary edge
# gateway and reverse proxy for JobGuard AI.
#
# Module Requirements:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule headers_module modules/mod_headers.so
#   LoadModule ssl_module modules/mod_ssl.so
# ==============================================================================

<VirtualHost *:80>
    ServerName jobguard.local
    ServerAlias www.jobguard.local
    DocumentRoot "C:/JobGuard-AI/frontend/dist"

    # Security Headers (OWASP Top 10 Hardening)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Enable HTTP Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Reverse Proxy: Node.js Express Backend API (/api)
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Reverse Proxy: FastAPI ML Microservice (/ml)
    ProxyPass /ml http://127.0.0.1:8000
    ProxyPassReverse /ml http://127.0.0.1:8000

    # Static Frontend SPA Delivery & Client Routing Fallback
    <Directory "C:/JobGuard-AI/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        # Serve existing files/directories directly
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Route all non-API paths to index.html for React Router SPA
        RewriteRule ^ index.html [L]
    </Directory>

    # Custom Error Documents
    ErrorDocument 404 /index.html
    ErrorDocument 502 /static/502.html

    ErrorLog "logs/jobguard_error.log"
    CustomLog "logs/jobguard_access.log" combined
</VirtualHost>
